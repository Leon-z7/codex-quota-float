<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src https://*.supabase.co wss://*.supabase.co" />
    <title>Codex 额度条</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="shell">
      <section id="bar" class="drag-region">
        <span class="grip">⠿</span>
        <div id="meters" class="meters"><span class="loading">正在读取 Codex 额度…</span></div>
        <button id="refresh" class="icon no-drag" title="刷新">↻</button>
        <button id="toggle" class="icon no-drag" title="展开">⌄</button>
        <button id="close" class="icon no-drag" title="关闭">×</button>
      </section>
      <section id="details" hidden>
        <div class="status-row">
          <strong>连接状态</strong>
          <span id="local-status" class="chip">Codex 连接中</span>
          <span id="cloud-status" class="chip muted">未配置同步</span>
        </div>
        <p id="message" class="message"></p>
        <form id="cloud-config" class="panel">
          <h2>跨设备同步</h2>
          <p>只同步额度百分比和重置时间，不同步聊天或 Codex 登录凭据。</p>
          <label>Supabase URL<input id="supabase-url" type="url" placeholder="https://xxxx.supabase.co" autocomplete="url" /></label>
          <label>Publishable key<input id="supabase-key" type="password" placeholder="sb_publishable_…" autocomplete="off" /></label>
          <button type="submit">保存云端配置</button>
        </form>
        <form id="auth-form" class="panel" hidden>
          <h2>同步账户</h2>
          <p>Windows 与 iPhone 使用同一账户；它不是 ChatGPT 密码。</p>
          <label>邮箱<input id="email" type="email" autocomplete="email" required /></label>
          <label>密码<input id="password" type="password" autocomplete="current-password" minlength="6" required /></label>
          <div class="actions"><button type="submit">登录</button><button id="signup" type="button" class="secondary">首次注册</button></div>
        </form>
        <div id="account" class="panel" hidden>
          <h2>同步已启用</h2>
          <p id="account-email"></p>
          <button id="signout" class="secondary">退出同步账户</button>
        </div>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
