<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codex Quota</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-style="apple">
<div id="mini-bar" aria-label="短期额度">
  <div class="mini-reading"><span id="mini-percent">—%</span><time id="mini-time">--:--</time></div>
  <button id="mini-more" aria-label="展开额度详情和设置" aria-expanded="false" aria-controls="shell" title="额度详情和设置"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="3" cy="10" r="1.75"/><circle cx="10" cy="10" r="1.75"/><circle cx="17" cy="10" r="1.75"/></svg></button>
</div>
<main id="shell">
  <header class="titlebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">⌘</span><span>Codex <span class="brand-muted">Quota</span></span></div>
    <div class="toolbar">
      <button id="pin" class="icon" title="始终置顶" aria-label="始终置顶" aria-pressed="true">◇</button>
      <button id="toggle" class="icon" title="设置" aria-label="展开设置" aria-expanded="false">⚙</button>
      <button id="hide" class="icon" title="收起到托盘" aria-label="收起到托盘">−</button>
    </div>
  </header>
  <div class="overview-label">可用额度<span id="plan"></span></div>
  <div id="bucket-row" class="bucket-row" hidden><label for="bucket">额度池</label><select id="bucket"></select></div>
  <section id="meters" class="meters" aria-label="Codex 剩余额度">
    <div class="empty"><div class="empty-mark" aria-hidden="true">…</div><strong>正在读取额度</strong><p>连接这台电脑上的 Codex</p></div>
  </section>
  <footer class="footer">
    <div class="status-text"><span id="dot" class="dot connecting"></span><span id="status" role="status" aria-live="polite">正在连接</span><span id="updated"></span></div>
    <button id="refresh" class="icon refresh" title="立即刷新" aria-label="立即刷新">↻</button>
  </footer>
  <div id="error" class="error" role="alert" hidden></div>
  <section id="settings" class="settings" hidden aria-label="偏好设置">
    <div class="settings-title"><h2>偏好设置</h2><span>v0.2.4 · Windows</span></div>
    <label class="field-label" for="style">窗口样式</label>
    <select id="style"><option value="apple">Apple · 简约卡片</option><option value="pill">Capsule · 紧凑胶囊</option><option value="fluent">Fluent · 简洁面板</option><option value="mini">Mini · 极简胶囊</option><option value="percent">Percent · 百分比悬停</option></select>
    <div class="setting-row"><label for="theme">外观</label><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div>
    <div class="setting-row"><label for="interval">自动刷新</label><select id="interval"><option value="30">每 30 秒</option><option value="60">每 1 分钟</option><option value="120">每 2 分钟</option><option value="300">每 5 分钟</option></select></div>
    <div class="setting-row"><label for="top">始终置顶</label><input id="top" class="switch" type="checkbox" checked></div>
    <p class="help">使用本机 Codex 的登录状态。拖动标题栏或胶囊文字区域移动窗口，点击「−」收起后，可从系统托盘重新打开。</p>
    <button id="quit" class="quit">退出应用</button>
  </section>
</main>
<script src="renderer.js"></script>
</body>
</html>
